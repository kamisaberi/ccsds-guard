version: "1.0"
scenario:
  name: "tactical_uav_swarm_combat_grid"
  description: "Pure Aerospace Swarm Combat Grid: 3 Sentry Appliances, 9 Device-Runtime Sensors, GCS, and EW Adversary"

networks:
  uav-combat-net:
    driver: bridge
    subnet: "10.240.52.0/24"
    gateway: "10.240.52.1"
    internal: false

volumes:
  shared-models: { driver: local }
  shared-datasets: { driver: local }
  shared-logs: { driver: local }

services:
  # ============================================================================
  # TIER 6: SENTINEL NEXUS (Master Command Plane & Mission Control Web UI)
  # ============================================================================
  nexus:
    build:
      context: .
      dockerfile: docker/Dockerfile.nexus
    container_name: matrix-nexus
    hostname: nexus.matrix.internal
    restart: unless-stopped
    privileged: true
    networks:
      uav-combat-net:
        ipv4_address: "10.240.52.10"
    ports:
      - "50051:50051"
      - "9443:9443"
      - "9444:9444"
    volumes:
      - ./configs:/opt/sentinel-nexus/configs:ro
      - ./models:/opt/sentinel-nexus/models
      - shared-datasets:/var/lib/sentinel-nexus/forge_datasets
      - shared-logs:/var/log/sentinel-nexus
      - ./shared/lib:/usr/local/lib/matrix-deps:ro
      - ./shared/bin/sentinel-nexus:/usr/local/bin/sentinel-nexus:ro
      - ./web:/opt/sentinel-nexus/web
      - ../../web:/opt/sentinel-nexus/web/plugins:ro
    environment:
      - LD_LIBRARY_PATH=/usr/local/lib/matrix-deps
      - VMWARE_ENVIRONMENT=true
      - NEXUS_ENV=simulation
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9443/api/v1/fleet/nodes"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ============================================================================
  # EDGE SENTRY 01: UAV ALPHA (Swarm Leader)
  # ============================================================================
  uav-alpha:
    build:
      context: .
      dockerfile: docker/Dockerfile.sentinel
    container_name: matrix-uav-alpha
    hostname: drone-alpha.matrix.internal
    restart: unless-stopped
    privileged: true
    cap_add: [NET_ADMIN, SYS_ADMIN, BPF]
    depends_on:
      nexus: { condition: service_healthy }
    networks:
      uav-combat-net:
        ipv4_address: "10.240.52.121"
    ports:
      - "50050:50050/udp"
    volumes:
      - ./configs/nodes/uav_alpha_leader.yaml:/etc/sentinel/sentinel.yaml:ro
      - ./configs:/etc/sentinel/configs:ro
      - ./models:/etc/sentinel/models:rw
      - ./models:/opt/sentinel/models:rw
      - shared-logs:/var/log/sentinel
      - ./shared/lib:/usr/local/lib/matrix-deps:ro
      - ./shared/bin/sentinel:/usr/local/bin/sentinel:ro
      - ../../build/ccsds_guard_dissector_plugin.so:/etc/sentinel/plugins.d/ccsds_guard_dissector_plugin.so:ro
    environment:
      - LD_LIBRARY_PATH=/usr/local/lib/matrix-deps
      - NODE_IDENTIFIER=UAV-ALPHA-LEADER
      - SITE_IDENTIFIER=Tactical-Combat-Airspace
      - NODE_SITE=Aerospace-Swarm-Airspace
      - PRIMARY_BACKEND=CPU_AVX512
      - VMWARE_VIRTUAL_NIC=true
      - XDP_MODE=SKB
      - NEXUS_HOST=10.240.52.10
      - NEXUS_PORT=50051

  # ============================================================================
  # EDGE SENTRY 02: UAV BRAVO (Wingman 1)
  # ============================================================================
  uav-bravo:
    build:
      context: .
      dockerfile: docker/Dockerfile.sentinel
    container_name: matrix-uav-bravo
    hostname: drone-bravo.matrix.internal
    restart: unless-stopped
    privileged: true
    cap_add: [NET_ADMIN, SYS_ADMIN, BPF]
    depends_on:
      nexus: { condition: service_healthy }
    networks:
      uav-combat-net:
        ipv4_address: "10.240.52.123"
    ports:
      - "50051:50050/udp"
    volumes:
      - ./configs/nodes/uav_bravo_wingman.yaml:/etc/sentinel/sentinel.yaml:ro
      - ./configs:/etc/sentinel/configs:ro
      - ./models:/etc/sentinel/models:rw
      - shared-logs:/var/log/sentinel
      - ./shared/lib:/usr/local/lib/matrix-deps:ro
      - ./shared/bin/sentinel:/usr/local/bin/sentinel:ro
      - ../../build/ccsds_guard_dissector_plugin.so:/etc/sentinel/plugins.d/ccsds_guard_dissector_plugin.so:ro
    environment:
      - LD_LIBRARY_PATH=/usr/local/lib/matrix-deps
      - NODE_IDENTIFIER=UAV-BRAVO-WINGMAN
      - SITE_IDENTIFIER=Tactical-Combat-Airspace
      - NODE_SITE=Aerospace-Swarm-Airspace
      - PRIMARY_BACKEND=CPU_AVX512
      - VMWARE_VIRTUAL_NIC=true
      - XDP_MODE=SKB
      - NEXUS_HOST=10.240.52.10
      - NEXUS_PORT=50051

  # ============================================================================
  # EDGE SENTRY 03: UAV CHARLIE (Recon Escort)
  # ============================================================================
  uav-charlie:
    build:
      context: .
      dockerfile: docker/Dockerfile.sentinel
    container_name: matrix-uav-charlie
    hostname: drone-charlie.matrix.internal
    restart: unless-stopped
    privileged: true
    cap_add: [NET_ADMIN, SYS_ADMIN, BPF]
    depends_on:
      nexus: { condition: service_healthy }
    networks:
      uav-combat-net:
        ipv4_address: "10.240.52.124"
    ports:
      - "50052:50050/udp"
    volumes:
      - ./configs/nodes/uav_charlie_recon.yaml:/etc/sentinel/sentinel.yaml:ro
      - ./configs:/etc/sentinel/configs:ro
      - ./models:/etc/sentinel/models:rw
      - shared-logs:/var/log/sentinel
      - ./shared/lib:/usr/local/lib/matrix-deps:ro
      - ./shared/bin/sentinel:/usr/local/bin/sentinel:ro
      - ../../build/ccsds_guard_dissector_plugin.so:/etc/sentinel/plugins.d/ccsds_guard_dissector_plugin.so:ro
    environment:
      - LD_LIBRARY_PATH=/usr/local/lib/matrix-deps
      - NODE_IDENTIFIER=UAV-CHARLIE-RECON
      - SITE_IDENTIFIER=Tactical-Combat-Airspace
      - NODE_SITE=Aerospace-Swarm-Airspace
      - PRIMARY_BACKEND=CPU_AVX512
      - VMWARE_VIRTUAL_NIC=true
      - XDP_MODE=SKB
      - NEXUS_HOST=10.240.52.10
      - NEXUS_PORT=50051

  # ============================================================================
  # PHYSICAL SENSORS: UAV ALPHA (Using device-runtime:latest)
  # ============================================================================
  sensor-alpha-gnss:
    image: sentinel-matrix/device-runtime:latest
    container_name: matrix-alpha-gnss
    restart: unless-stopped
    networks:
      uav-combat-net: { ipv4_address: "10.240.52.141" }
    ports: ["15023:502"]
    command: ["--archetype", "sensor", "--protocol", "modbus", "--port", "502", "--name", "Alpha-GNSS-CN0-Monitor"]

  sensor-alpha-imu:
    image: sentinel-matrix/device-runtime:latest
    container_name: matrix-alpha-imu
    restart: unless-stopped
    networks:
      uav-combat-net: { ipv4_address: "10.240.52.142" }
    ports: ["15050:502"]
    command: ["--archetype", "sensor", "--protocol", "modbus", "--port", "502", "--name", "Alpha-MEMS-Flight-Gyro"]

  sensor-alpha-pitot:
    image: sentinel-matrix/device-runtime:latest
    container_name: matrix-alpha-pitot
    restart: unless-stopped
    networks:
      uav-combat-net: { ipv4_address: "10.240.52.143" }
    ports: ["15092:502"]
    command: ["--archetype", "sensor", "--protocol", "modbus", "--port", "502", "--name", "Alpha-Pitot-Static-Airspeed"]

  # ============================================================================
  # PHYSICAL SENSORS: UAV BRAVO (Using device-runtime:latest)
  # ============================================================================
  sensor-bravo-gnss:
    image: sentinel-matrix/device-runtime:latest
    container_name: matrix-bravo-gnss
    restart: unless-stopped
    networks:
      uav-combat-net: { ipv4_address: "10.240.52.144" }
    ports: ["15024:502"]
    command: ["--archetype", "sensor", "--protocol", "modbus", "--port", "502", "--name", "Bravo-GNSS-CN0-Monitor"]

  sensor-bravo-imu:
    image: sentinel-matrix/device-runtime:latest
    container_name: matrix-bravo-imu
    restart: unless-stopped
    networks:
      uav-combat-net: { ipv4_address: "10.240.52.145" }
    ports: ["15051:502"]
    command: ["--archetype", "sensor", "--protocol", "modbus", "--port", "502", "--name", "Bravo-MEMS-Flight-Gyro"]

  sensor-bravo-pitot:
    image: sentinel-matrix/device-runtime:latest
    container_name: matrix-bravo-pitot
    restart: unless-stopped
    networks:
      uav-combat-net: { ipv4_address: "10.240.52.146" }
    ports: ["15093:502"]
    command: ["--archetype", "sensor", "--protocol", "modbus", "--port", "502", "--name", "Bravo-Pitot-Static-Airspeed"]

  # ============================================================================
  # PHYSICAL SENSORS: UAV CHARLIE (Using device-runtime:latest)
  # ============================================================================
  sensor-charlie-gnss:
    image: sentinel-matrix/device-runtime:latest
    container_name: matrix-charlie-gnss
    restart: unless-stopped
    networks:
      uav-combat-net: { ipv4_address: "10.240.52.147" }
    ports: ["15025:502"]
    command: ["--archetype", "sensor", "--protocol", "modbus", "--port", "502", "--name", "Charlie-GNSS-CN0-Monitor"]

  sensor-charlie-imu:
    image: sentinel-matrix/device-runtime:latest
    container_name: matrix-charlie-imu
    restart: unless-stopped
    networks:
      uav-combat-net: { ipv4_address: "10.240.52.148" }
    ports: ["15052:502"]
    command: ["--archetype", "sensor", "--protocol", "modbus", "--port", "502", "--name", "Charlie-MEMS-Flight-Gyro"]

  sensor-charlie-altimeter:
    image: sentinel-matrix/device-runtime:latest
    container_name: matrix-charlie-altimeter
    restart: unless-stopped
    networks:
      uav-combat-net: { ipv4_address: "10.240.52.149" }
    ports: ["15098:2368/udp"]
    command: ["--archetype", "vision", "--protocol", "stream_telemetry", "--port", "2368", "--name", "Charlie-Laser-Altimeter-LiDAR"]

  sensor-charlie-pitot:
    image: sentinel-matrix/device-runtime:latest
    container_name: matrix-charlie-pitot
    restart: unless-stopped
    networks:
      uav-combat-net: { ipv4_address: "10.240.52.150" }
    ports: ["15094:502"]
    command: ["--archetype", "sensor", "--protocol", "modbus", "--port", "502", "--name", "Charlie-Pitot-Static-Airspeed"]
# ============================================================================
  # TACTICAL GCS & ADVERSARY (Mounted Scripts, Live 3D Coordinate Stream :18090)
  # ============================================================================
  uav-gcs:
    image: python:3.11-slim
    container_name: matrix-uav-gcs
    hostname: gcs.matrix.internal
    restart: unless-stopped
    depends_on:
      nexus: { condition: service_healthy }
    networks:
      uav-combat-net:
        ipv4_address: "10.240.52.120"
    ports:
      - "18090:8090"
    volumes:
      - ./tools/gcs_transmitter.py:/app/gcs.py:ro
    command: ["python3", "-u", "/app/gcs.py"]


    
  ew-spoofer:
    image: python:3.11-slim
    container_name: matrix-ew-spoofer
    hostname: ew-spoofer.matrix.internal
    restart: unless-stopped
    depends_on:
      nexus: { condition: service_healthy }
    networks:
      uav-combat-net:
        ipv4_address: "10.240.52.122"
    volumes:
      - ./tools/ew_spoofer.py:/app/spoofer.py:ro
    command: ["python3", "-u", "/app/spoofer.py"]