# ============================================================================
  # ISOLATED PYTHON SENSOR CONTAINERS (UAV ALPHA SENSORS)
  # ============================================================================
  sensor-alpha-gnss:
    image: python:3.11-slim
    container_name: matrix-alpha-s023
    restart: unless-stopped
    networks:
      swarm-combat-net: { ipv4_address: "10.240.52.141" }
    volumes:
      - ./tools/sensor_daemon.py:/app/sensor.py:ro
    environment:
      SENSOR_ID: "ALPHA_S023_GNSS"
      SENSOR_NAME: "GNSS C/N0 Anti-Spoofing Monitor"
      SENSOR_UNIT: "dBm"
      SENSOR_BASELINE: "-85.0"
    command: ["python3", "-u", "/app/sensor.py"]

  sensor-alpha-imu:
    image: python:3.11-slim
    container_name: matrix-alpha-s050
    restart: unless-stopped
