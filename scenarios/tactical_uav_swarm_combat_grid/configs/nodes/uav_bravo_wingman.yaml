# File: /home/kami/ccsds-guard/scenarios/tactical_uav_swarm_combat_grid/configs/nodes/uav_bravo_wingman.yaml

node:
  identifier: "UAV-BRAVO-WINGMAN"
  site_identifier: "Tactical-Combat-Airspace"
  hardware:
    type: "DEVICE_VIRTUAL_TPM"
    primary_backend: "CPU_AVX512"
    xdp_driver_mode: "SKB"

ui_profile:
  template: "aerospace_uav"
  overrides:
    instrument_title: "SWARM FORMATION & INTERCEPT HUD (BRAVO WINGMAN)"
    instrument_type: "formation"
    sensors_add:
      - sensor_id: BRAVO_S023_GNSS
        name: GNSS C/N0 Anti-Spoofing Monitor
        category: RF_EM
        port: 15024
        unit: dBm
        baseline: -85.0
      - sensor_id: BRAVO_S050_IMU
        name: 3-Axis MEMS Flight Gyro & Accel
        category: KINEMATIC
        port: 15051
        unit: deg/s
        baseline: 12.4
      - sensor_id: BRAVO_S092_PITOT
        name: Heated Pitot-Static Airspeed Probe
        category: AVIONICS
        port: 15093
        unit: knots
        baseline: 118.0

nexus:
  enabled: true
  host: "10.240.52.10"
  port: 50051
  nexus_http_port: 9443
  active_model_name: "network_threat_int8.onnx"
  local_models_dir: "/etc/sentinel/models"

subsystems:
  grid_telecontrol_guard: true
  monitored_protocols: ["STANAG4586", "CCSDS133"]
  ebpf_line_rate_drop: true

routes:
  - sensor_id: UAV-Bravo-Demod-02
    sensor_type: TACTICAL_RADIO_SDR
    driver_mode: AF_XDP_UMEM
    match:
      port: 50050
      transport: udp
      plugin_id: ccsds_guard_dissector_plugin.so
      owner_subsystem: 18_cps_sec
      execution_mode: CASCADE_SHORT_CIRCUIT
      latency_budget_ns: 25000
      threshold_drop: 0.90