node:
  identifier: "UAV-CHARLIE-RECON"
  site_identifier: "Tactical-Combat-Airspace"
  hardware:
    type: "DEVICE_VIRTUAL_TPM"
    primary_backend: "CPU_AVX512"
    xdp_driver_mode: "SKB"

ui_profile:
  template: "aerospace_uav"
  overrides:
    instrument_title: "OPTICAL FLIR THERMAL RECON GIMBAL (CHARLIE RECON)"
    instrument_type: "video"
    sensors_add:
      - sensor_id: "flir_thermal_gimbal"
        name: "Optical Thermal Recon Gimbal"
        category: "TEMPERATURE"
        port: 8554
        unit: "°C"
        baseline: 38.5
    attacks_add:
      - id: "laser_sensor_dazzle"
        name: "[!] INJECT OPTICAL SENSOR BLINDING"

nexus:
  enabled: true
  host: "10.240.52.10"
  port: 50051
  nexus_http_port: 9443
  active_model_name: "network_threat_int8.onnx"
  local_models_dir: "/etc/sentinel/models"

subsystems:
  grid_telecontrol_guard: true
  monitored_protocols: ["STANAG4586", "CCSDS133"]
  ebpf_line_rate_drop: true

routes:
  - sensor_id: UAV-Charlie-Demod-03
    sensor_type: TACTICAL_RADIO_SDR
    driver_mode: AF_XDP_UMEM
    match:
      port: 50050
      transport: udp
      plugin_id: ccsds_guard_dissector_plugin.so
      owner_subsystem: 18_cps_sec
      execution_mode: CASCADE_SHORT_CIRCUIT
      latency_budget_ns: 25000
      threshold_drop: 0.90