# ==============================================================================
# ARYORITHM CCSDS-GUARD: AUTONOMOUS UAV SWARM TACTICAL DEFENSE TWIN
# Standards: NATO STANAG 4586 & CCSDS 133.0-B-2 (Sub-120 ns Invariant)
# ==============================================================================

scenario:
  name: "uav_swarm_tactical_defense"
  description: "Autonomous UAV Swarm telecommand link defense against replay attacks and GPS kinematic spoofing"
  base_subnet: "10.240.0"

dynamic_nodes:
  # ----------------------------------------------------------------------------
  # 1. TACTICAL GROUND CONTROL STATION (Legitimate Telecommands)
  # ----------------------------------------------------------------------------
  - name: "uav-gcs-tactical-01"
    hostname: "gcs-01.matrix.internal"
    ip: "10.240.0.120"
    ports:
      - "50050:50050/udp"
    network: "sentinel-grid-net"
    environment:
      NODE_ROLE: "GCS_TRANSMITTER"
      TARGET_DRONE_IP: "10.240.0.121"
      TARGET_PORT: "50050"
      STANAG_MSG_TYPE: "0x1001"
    command:
      - "python3"
      - "-c"
      - |
        import socket, time, struct
        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        seq = 100
        while True:
            # Emit valid STANAG 4586 command: MsgType(2), VehID(4), Seq(4), Time(8), Len(2)
            now_us = int(time.time() * 1e6)
            pkt = struct.pack(">HIIQH12s", 0x1001, 1, seq, now_us, 12, b"WAYPOINT_CMD")
            sock.sendto(pkt, ("10.240.0.121", 50050))
            seq += 1
            time.sleep(0.1)

  # ----------------------------------------------------------------------------
  # 2. UAV FLIGHT CONTROLLER (Protected by ccsds_guard_dissector_plugin)
  # ----------------------------------------------------------------------------
  - name: "uav-alpha-leader"
    hostname: "drone-alpha.matrix.internal"
    ip: "10.240.0.121"
    ports:
      - "50050:50050/udp"
      - "50100:50100/udp"
    network: "sentinel-grid-net"
    environment:
      NODE_ROLE: "PROTECTED_UAV"
      ACTIVE_PLUGIN: "ccsds_guard_dissector_plugin.so"
      AIRGAP_RELAY_PIN: "17"
    command:
      - "python3"
      - "-c"
      - |
        import socket
        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        sock.bind(("0.0.0.0", 50050))
        print("[UAV Flight Controller] Armed. Ingesting telecommands on :50050...")
        while True:
            data, addr = sock.recvfrom(2048)

  # ----------------------------------------------------------------------------
  # 3. ELECTRONIC WARFARE ADVERSARY (Replay & GPS Spoofing Injections)
  # ----------------------------------------------------------------------------
  - name: "ew-adversary-spoofer"
    hostname: "ew-spoofer.matrix.internal"
    ip: "10.240.0.122"
    network: "sentinel-grid-net"
    environment:
      NODE_ROLE: "ADVERSARY"
      TARGET_DRONE_IP: "10.240.0.121"
      TARGET_PORT: "50050"
    command:
      - "python3"
      - "-c"
      - |
        import socket, time, struct
        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        time.sleep(3) # Wait for network stabilization
        while True:
            # 1. Blasting replayed sequence counter (must be dropped by SlidingWindow)
            stale_seq = 100
            now_us = int(time.time() * 1e6)
            replayed_pkt = struct.pack(">HIIQH12s", 0x1001, 1, stale_seq, now_us, 12, b"REPLAYED_CMD")
            sock.sendto(replayed_pkt, ("10.240.0.121", 50050))

            # 2. Blasting GPS teleportation jump (> 80 m/s physical threshold)
            spoofed_pkt = struct.pack(">HIIQH12s", 0x1001, 1, stale_seq + 500, now_us, 12, b"GPS_TELEPORT")
            sock.sendto(spoofed_pkt, ("10.240.0.121", 50050))
            time.sleep(0.5)