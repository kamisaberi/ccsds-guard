# File: /home/kami/ccsds-guard/scenarios/uav_swarm_tactical_defense/configs/nodes/uav_alpha_leader.yaml

# ============================================================================
# ARYORITHM MODEL ROUTING DAG: TACTICAL UAV SWARM (UAV-ALPHA-LEADER)
# Standards: NATO STANAG 4586 & CCSDS 133.0-B-2 (Sub-120 ns Defense)
# ============================================================================

node:
  identifier: "UAV-ALPHA-LEADER"
  site_identifier: "Tactical-Aerospace-Swarm"
  hardware:
    type: "DEVICE_VIRTUAL_TPM"
    primary_backend: "CPU_AVX512"
    xdp_driver_mode: "SKB"

nexus:
  enabled: true
  host: "10.240.50.10"
  port: 50051
  nexus_http_port: 9443
  active_model_name: "network_threat_int8.onnx"
  local_models_dir: "/etc/sentinel/models"

subsystems:
  grid_telecontrol_guard: true
  monitored_protocols: ["STANAG4586", "CCSDS133"]
  ebpf_line_rate_drop: true

# --- STAGE 2 SENSOR-TO-MODEL ROUTING DAG ---
routes:
  - sensor_id: UAV-Radio-Demod-01
    sensor_type: TACTICAL_RADIO_SDR
    driver_mode: AF_XDP_UMEM
    match:
      port: 50050
      transport: udp
      plugin_id: ccsds_guard_dissector_plugin.so
      owner_subsystem: 18_cps_sec
      execution_mode: CASCADE_SHORT_CIRCUIT
      latency_budget_ns: 25000
      threshold_drop: 0.90